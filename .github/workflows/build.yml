name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: npx electron-builder -w --x64 -p never

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 -p never

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 -p never

      - uses: actions/upload-artifact@v4
        with:
          name: fluent-reader-${{ runner.os }}
          path: dist/

  Publish_and_Release:
    name: Publish and Release (All Artifacts)
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
