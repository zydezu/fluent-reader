name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.1)"
        required: true
      changelog:
        description: "Release notes / changelog"
        required: false

jobs:
  linux_x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --x64 -p never
      - name: Zip artifact
        run: |
          cd bin/linux/x64
          zip -r ../../../Fluent-Reader_Linux_x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Fluent-Reader_Linux_x64
          path: Fluent-Reader_Linux_x64.zip

  macos_x64:
    name: Build macOS x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --x64 -p never
      - name: Zip artifact
        run: |
          cd bin/darwin/x64
          zip -r ../../../Fluent-Reader_MacOS_x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Fluent-Reader_MacOS_x64
          path: Fluent-Reader_MacOS_x64.zip

  macos_arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --arm64 -p never || true
      - name: Zip artifact
        continue-on-error: true
        run: |
          cd bin/darwin/arm64
          zip -r ../../../Fluent-Reader_MacOS_ARM64.zip .
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Fluent-Reader_MacOS_ARM64
          path: Fluent-Reader_MacOS_ARM64.zip

  windows_x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder -w --x64 -p never
      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path bin/win32/x64/* -DestinationPath Fluent-Reader_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fluent-Reader_Windows_x64
          path: Fluent-Reader_Windows_x64.zip

  windows_arm64:
    name: Build Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder -w --arm64 -p never || true
      - name: Zip artifact
        shell: pwsh
        continue-on-error: true
        run: Compress-Archive -Path bin/win32/arm64/* -DestinationPath Fluent-Reader_Windows_ARM64.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Fluent-Reader_Windows_ARM64
          path: Fluent-Reader_Windows_ARM64.zip

  release:
    name: Create Release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux_x64
      - macos_x64
      - macos_arm64
      - windows_x64
      - windows_arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: List artifacts
        run: ls -la releases/
      - name: Create GitHub release
        run: |
          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            gh release create "${{ github.event.inputs.tag }}" releases/* \
              --title "Fluent Reader ${{ github.event.inputs.tag }}" \
              --notes "${{ github.event.inputs.changelog }}"
          else
            gh release create "${{ github.event.inputs.tag }}" releases/* \
              --title "Fluent Reader ${{ github.event.inputs.tag }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
