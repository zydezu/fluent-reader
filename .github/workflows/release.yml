name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.1)"
        required: true
      changelog:
        description: "Release notes / changelog"
        required: false
      release_type:
        description: "Release type"
        required: true
        type: choice
        default: draft
        options:
          - draft
          - prerelease
          - release

jobs:
  linux_x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: Fluent-Reader_Linux_x64
          path: bin/linux/x64/Fluent-Reader_Linux_x64.AppImage

  macos_x64:
    name: Build macOS x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: Fluent-Reader_MacOS_x64
          path: bin/darwin/x64/Fluent-Reader_MacOS_x64.dmg

  macos_arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --arm64 -p never || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Fluent-Reader_MacOS_ARM64
          path: bin/darwin/arm64/Fluent-Reader_MacOS_arm64.dmg

  windows_x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder -w --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: Fluent-Reader_Windows_x64
          path: bin/win32/x64/Fluent-Reader_Windows_x64.exe

  windows_arm64:
    name: Build Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder -w --arm64 -p never || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Fluent-Reader_Windows_ARM64
          path: bin/win32/arm64/Fluent-Reader_Windows_arm64.exe

  release:
    name: Create Release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux_x64
      - macos_x64
      - macos_arm64
      - windows_x64
      - windows_arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: List artifacts
        run: ls -la releases/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          flags=()
          case "$RELEASE_TYPE" in
            draft)      flags+=(--draft) ;;
            prerelease) flags+=(--prerelease) ;;
          esac

          if [ -n "$CHANGELOG" ]; then
            flags+=(--notes "$CHANGELOG")
          else
            flags+=(--generate-notes)
          fi

          gh release create "$TAG" releases/* \
            --title "Fluent Reader $TAG" \
            "${flags[@]}"
